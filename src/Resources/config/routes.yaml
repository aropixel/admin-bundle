# SECURITY
aropixel_security:
    resource: "@AropixelAdminBundle/Resources/config/routes/security.yaml"

aropixel_reset:
    resource: "@AropixelAdminBundle/Resources/config/routes/reset.yaml"

aropixel_first:
    resource: "@AropixelAdminBundle/Resources/config/routes/first.yaml"

aropixel_activation:
    resource: "@AropixelAdminBundle/Resources/config/routes/activation.yaml"

_admin:
    path: /
    controller: Aropixel\AdminBundle\Controller\Dashboard\DashboardAction

# Component catalogue — dev only (design-system.md §14). The controller also guards on the
# environment; the route condition keeps it out of the prod router entirely.
aropixel_admin_catalog:
    path: /_catalog
    controller: Aropixel\AdminBundle\Controller\Catalog\CatalogAction
    condition: "env('APP_ENV') === 'dev'"

aropixel_admin_users:
    resource: "@AropixelAdminBundle/Resources/config/routes/user.yaml"

aropixel_admin_images:
    resource: "@AropixelAdminBundle/Resources/config/routes/image.yaml"

aropixel_admin_files:
    resource: "@AropixelAdminBundle/Resources/config/routes/file.yaml"
